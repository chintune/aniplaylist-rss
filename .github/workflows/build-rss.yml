name: Build RSS

on:
  workflow_dispatch:

  push:
    paths:
      - "scrape.mjs"
      - "site/index.html"
      - ".github/workflows/build-rss.yml"

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
      SITE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # Node.js
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false


      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: npm install


      # --------------------------------------------------
      # Install Playwright Chromium
      # --------------------------------------------------

      - name: Install Chromium
        run: npx playwright install --with-deps chromium


      # --------------------------------------------------
      # Apply Spotify source fix to scrape.mjs in the runner
      # --------------------------------------------------
      #
      # The repository's scrape.mjs remains untouched. This step applies
      # the Spotify-source upgrade to the checked-out copy before the RSS
      # build runs, so no manual patching of scrape.mjs is required.
      #
      # The new source keeps BOTH direct Spotify track URLs and album/OST
      # URLs, together with the song/artist metadata needed by spotify.mjs.
      # --------------------------------------------------

      - name: Prepare Spotify source
        run: |
          node <<'NODE'
          import fs from "node:fs/promises";

          const file = "scrape.mjs";
          let source = await fs.readFile(file, "utf8");

          const newBlock = [
            '  currentSpotifyTracks[season] = [',
            '    ...new Map(',
            '      usable',
            '        .filter(item => !!item.spotify)',
            '        .map(item => {',
            '          const match = String(item.spotify || "").match(',
            '            /https?:\\/\\/open\\.spotify\\.com\\/(?:intl-[^/]+\\/)?(track|album)\\/([A-Za-z0-9]+)/i',
            '          );',
            '',
            '          if (!match) {',
            '            return null;',
            '          }',
            '',
            '          return {',
            '            type: match[1].toLowerCase(),',
            '            id: match[2],',
            '            url: String(item.spotify || ""),',
            '            anime: item.anime || "",',
            '            song: item.song || "",',
            '            artist: item.artist || "",',
            '            kind: item.kind || "",',
            '            aniPlaylistId: item.id || "",',
            '          };',
            '        })',
            '        .filter(Boolean)',
            '        .map(ref => [',
            '          [ref.type, ref.id, ref.song, ref.artist].join(":"),',
            '          ref,',
            '        ])',
            '    ).values(),',
            '  ];',
          ].join("\n");

          const newWrite = [
            "await fs.writeFile(",
            "  SPOTIFY_CURRENT_PATH,",
            "  JSON.stringify(",
            "    {",
            "      version: 1,",
            "      generatedAt: new Date().toISOString(),",
            "      seasons: currentSpotifyTracks,",
            "    },",
            "    null,",
            "    2",
            '  ) + "\\n"',
            ");",
          ].join("\n");

          const alreadyPatched =
            source.includes(".filter(item => !!item.spotify)") &&
            source.includes("type: match[1].toLowerCase()") &&
            source.includes("seasons: currentSpotifyTracks");

          if (alreadyPatched) {
            console.log("Spotify source fix is already present; nothing to change.");
            process.exit(0);
          }

          const start = source.indexOf("  currentSpotifyTracks[season] = [");
          const end = source.indexOf("\n\n  console.log(", start);

          if (start < 0 || end < 0) {
            throw new Error(
              "Could not locate the expected currentSpotifyTracks block in scrape.mjs."
            );
          }

          source = source.slice(0, start) + newBlock + source.slice(end);

          const writeStart = source.indexOf(
            "await fs.writeFile(\n  SPOTIFY_CURRENT_PATH,"
          );
          const writeEnd =
            writeStart >= 0 ? source.indexOf("\n);", writeStart) : -1;

          if (writeStart < 0 || writeEnd < 0) {
            throw new Error(
              "Could not locate the expected spotify-current.json write block in scrape.mjs."
            );
          }

          source =
            source.slice(0, writeStart) +
            newWrite +
            source.slice(writeEnd + 3);

          await fs.writeFile(file, source, "utf8");

          console.log("Spotify source fix applied to runner copy of scrape.mjs.");
          console.log("The repository's scrape.mjs is not modified or committed.");
          NODE



      # --------------------------------------------------
      # Validate JavaScript before any remote Spotify changes
      # --------------------------------------------------

      - name: Validate JavaScript
        run: |
          node --check scrape.mjs
          node --check spotify.mjs


      # --------------------------------------------------
      # Build AniPlaylist RSS
      # --------------------------------------------------

      - name: Build RSS
        run: node scrape.mjs

      # scrape.mjs still generates the legacy landing page as part of its
      # data build. Keep the redesigned, repository-managed single-page UI
      # for the Pages artifact while retaining generated browse/song pages.
      - name: Preserve redesigned homepage
        run: git checkout -- site/index.html


      # --------------------------------------------------
      # Sync Spotify playlists
      # --------------------------------------------------

      - name: Sync Spotify playlists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node spotify.mjs


      # --------------------------------------------------
      # Show build information
      # --------------------------------------------------

      - name: Show build summary
        if: always()
        run: |
          echo "===== RSS BUILD SUMMARY ====="
          cat build-summary.txt 2>/dev/null || true

          echo ""
          echo "===== SPOTIFY PLAYLIST CONFIG ====="
          cat spotify-playlists.json 2>/dev/null || true

          echo ""
          echo "===== SPOTIFY CURRENT SOURCE ====="
          cat spotify-current.json 2>/dev/null || true

          echo ""
          echo "===== DEBUG FILES ====="
          find debug -maxdepth 1 -type f -print 2>/dev/null || true


      # --------------------------------------------------
      # Commit RSS state + Spotify playlist state
      # --------------------------------------------------

      - name: Commit state and diagnostics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json
          git add resolve-cache.json
          git add build-summary.txt
          git add spotify-playlists.json

          git add -f debug/*.json debug/*.png 2>/dev/null || true

          echo "===== STAGED FILES ====="
          git status --short

          if git diff --cached --quiet; then
            echo "No state/debug/Spotify changes to commit."
          else
            git commit -m "Update AniPlaylist RSS and Spotify playlists"

            git fetch origin main
            if git merge-base --is-ancestor HEAD origin/main; then
              git push origin HEAD:main
            else
              echo "Remote main advanced during the build; skipping state push."
            fi
          fi

      # --------------------------------------------------
      # Build GitHub Pages site
      # --------------------------------------------------

      - name: Build Pages site
        run: |
          rm -rf site_build

          mkdir -p site_build/rss

          cp -r site/. site_build/

          cp seasons.json site_build/seasons.json

          cp spotify-playlists.json site_build/spotify-playlists.json
          
          # scrape.mjs generates site/catalog.json from this run's
          # current usable releases; copying site/. above includes it.

          cp -r rss/. site_build/rss/


      # --------------------------------------------------
      # Upload Pages artifact
      # --------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site_build


      # --------------------------------------------------
      # Deploy GitHub Pages
      # --------------------------------------------------

      - name: Deploy Pages
        uses: actions/deploy-pages@v5

# homepage: dedicated landing page

# home rebuild trigger
