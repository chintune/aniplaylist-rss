name: Build RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
      SITE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build RSS
        run: node scrape.mjs

      - name: Show build summary
        if: always()
        run: |
          echo "===== RSS BUILD SUMMARY ====="
          cat build-summary.txt 2>/dev/null || true
          echo "===== DEBUG FILES ====="
          find debug -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Commit state and diagnostics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json resolve-cache.json debug/ build-summary.txt
          if git diff --cached --quiet; then
            echo "No state/debug changes to commit."
          else
            git commit -m "Update AniPlaylist RSS state"
            git push
          fi

      - name: Build Pages site
        run: |
          rm -rf site_build
          mkdir -p site_build/rss
          cp -r site/. site_build/
          cp seasons.json site_build/seasons.json
          cp -r rss/. site_build/rss/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site_build

      - name: Deploy Pages
        uses: actions/deploy-pages@v5
