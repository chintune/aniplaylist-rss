name: Build RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build RSS
        run: node scrape.mjs

      - name: Show build summary
        if: always()
        run: |
          echo "===== RSS BUILD SUMMARY ====="
          cat build-summary.txt 2>/dev/null || true
          echo "===== DEBUG FILES ====="
          find debug -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Commit state and diagnostics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json resolve-cache.json debug/ build-summary.txt
          if git diff --cached --quiet; then
            echo "No state/debug changes to commit."
          else
            git commit -m "Update AniPlaylist RSS state"
            git push
          fi

      - name: Build Pages site
        run: |
          rm -rf site
          mkdir -p site/rss
          cp -r rss/. site/rss/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>AniPlaylist RSS</title>
          </head>
          <body>
            <h1>AniPlaylist RSS</h1>
            <p>Season feeds generated from AniPlaylist.</p>
            <ul>
              <li><a href="rss/fall-2026.xml">Fall 2026</a></li>
              <li><a href="rss/winter-2027.xml">Winter 2027</a></li>
              <li><a href="rss/spring-2027.xml">Spring 2027</a></li>
              <li><a href="rss/summer-2027.xml">Summer 2027</a></li>
              <li><a href="rss/fall-2027.xml">Fall 2027</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy Pages
        uses: actions/deploy-pages@v5
