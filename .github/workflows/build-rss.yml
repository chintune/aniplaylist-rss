name: Build RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: aniplaylist-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build RSS
        run: node scrape.mjs

      - name: Persist scraper state and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rss-state.json resolve-cache.json debug/
          if git diff --cached --quiet; then
            echo 'No scraper state changes to commit.'
          else
            git commit -m 'Update AniPlaylist RSS state'
            git push
          fi

      - name: Prepare Pages site
        run: |
          rm -rf site
          mkdir -p site/rss
          cp -f rss/*.xml site/rss/

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>AniPlaylist RSS</title>
          </head>
          <body>
            <h1>AniPlaylist RSS</h1>
            <p>Available seasonal feeds:</p>
            <ul>
          HTML

          for f in site/rss/*.xml; do
            name="$(basename "$f")"
            printf '      <li><a href="rss/%s">%s</a></li>\n' "$name" "$name" >> site/index.html
          done

          cat >> site/index.html <<'HTML'
            </ul>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
