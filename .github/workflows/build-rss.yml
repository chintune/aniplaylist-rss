name: Build RSS

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scrape.mjs"
      - "spotify.mjs"
      - "package.json"
      - "package-lock.json"
      - "seasons.json"
      - "spotify-playlists.json"
      - "lib/**"
      - "test/**"
      - "site/**"
      - ".github/workflows/build-rss.yml"

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
      SITE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # Node.js
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false


      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------
      # Validate code before installing Chromium or scraping
      # --------------------------------------------------

      - name: Validate JavaScript
        run: |
          node --check scrape.mjs
          node --check spotify.mjs
          node --check lib/scrape-safety.mjs
          node --check lib/spotify-safety.mjs
          npm test


      # --------------------------------------------------
      # Install Playwright Chromium
      # --------------------------------------------------

      - name: Install Chromium
        run: npx playwright install --with-deps chromium


      # --------------------------------------------------
      # Build AniPlaylist RSS
      # --------------------------------------------------

      - name: Build RSS
        run: node scrape.mjs

      # --------------------------------------------------
      # Sync Spotify playlists
      # --------------------------------------------------

      - name: Sync Spotify playlists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node spotify.mjs


      # --------------------------------------------------
      # Show build information
      # --------------------------------------------------

      - name: Show build summary
        if: always()
        run: |
          echo "===== RSS BUILD SUMMARY ====="
          cat build-summary.txt 2>/dev/null || true

          echo ""
          echo "===== SPOTIFY PLAYLIST CONFIG ====="
          cat spotify-playlists.json 2>/dev/null || true

          echo ""
          echo "===== SPOTIFY CURRENT SOURCE ====="
          cat spotify-current.json 2>/dev/null || true

          echo ""
          echo "===== DEBUG FILES ====="
          find debug -maxdepth 1 -type f -print 2>/dev/null || true


      # --------------------------------------------------
      # Commit RSS state + Spotify playlist state
      # --------------------------------------------------

      - name: Commit state and diagnostics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json
          git add build-summary.txt
          git add spotify-playlists.json

          git add -f debug/*.json 2>/dev/null || true

          echo "===== STAGED FILES ====="
          git status --short

          if git diff --cached --quiet; then
            echo "No state/debug/Spotify changes to commit."
          else
            git commit -m "Update AniPlaylist RSS and Spotify playlists"

            git fetch origin main
            # The generated state commit must be based on the current remote tip.
            # Check that origin/main is an ancestor of HEAD, not the reverse.
            if git merge-base --is-ancestor origin/main HEAD; then
              git push origin HEAD:main
            else
              echo "Remote main advanced during the build; skipping state push."
            fi
          fi

      # --------------------------------------------------
      # Build GitHub Pages site
      # --------------------------------------------------

      - name: Build Pages site
        run: |
          rm -rf site_build

          mkdir -p site_build/rss

          cp -r site/. site_build/

          cp seasons.json site_build/seasons.json

          cp spotify-playlists.json site_build/spotify-playlists.json
          
          # scrape.mjs generates site/catalog.json from this run's
          # current usable releases; copying site/. above includes it.

          cp -r rss/. site_build/rss/


      # --------------------------------------------------
      # Upload Pages artifact
      # --------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site_build


      - name: Upload scraper screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scraper-debug-screenshots
          path: debug/*.png
          if-no-files-found: ignore
          retention-days: 7


      # --------------------------------------------------
      # Deploy GitHub Pages
      # --------------------------------------------------

      - name: Deploy Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      
# homepage: dedicated landing page

# home rebuild trigger

